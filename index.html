<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ecommerce</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-100 min-h-screen">

    <!-- HEADER -->
    <header class="bg-black text-white shadow-lg">

        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">

        <h1 class="text-3xl font-bold tracking-wide">
            Mi Ecommerce
        </h1>

        <nav class="flex gap-6 text-lg">

            <a href="#" class="hover:text-gray-300 transition">
            Inicio
            </a>

            <a href="#" class="hover:text-gray-300 transition">
            Productos
            </a>

            <a href="#" class="hover:text-gray-300 transition">
            Contacto
            </a>

        </nav>

        </div>

    </header>



    <!-- MAIN -->
    <main class="max-w-7xl mx-auto px-6 py-10">

        <!-- GRID PRODUCTOS -->
        <section id="card-container" class="grid grid-cols-4 gap-6">

        </section>

        

        <!-- PAGINACIÓN -->
        <section class="flex justify-center items-center gap-3 mt-12">

        <button id="prev-btn" class="bg-white px-5 py-2 rounded-xl shadow hover:bg-gray-200 transition">
            Prev
        </button>

        <button id="next-btn" class="bg-white px-5 py-2 rounded-xl shadow hover:bg-gray-200 transition">
            Next
        </button>

        </section>

        <script src="main.js"></script>
    </body>
</html>
